[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fingraph"
version = "0.1.0"
description = "Streaming graph analytics foundation for financial-crime investigations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "kafka-python-ng>=2.2.3",
  "neo4j>=5.23,<6",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.0",
]
streaming = [
  "apache-flink==1.20.5",
  "setuptools<81",
]

[project.scripts]
fingraph-sim = "fingraph.cli:main"
fingraph-stream = "fingraph.flink_consumer:main"
fingraph-analytics = "fingraph.graph_analytics:main"
fingraph-audit = "fingraph.pipeline_audit:main"
fingraph-gds = "fingraph.gds_analytics:main"
fingraph-pagerank = "fingraph.gds_centrality:main"
fingraph-dashboard-api = "fingraph.dashboard_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
