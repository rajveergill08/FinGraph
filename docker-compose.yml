name: fingraph

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/change-me-now
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    volumes:
      - neo4j_data:/data
      - ./neo4j:/import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p change-me-now 'RETURN gds.version();' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  stream-processor:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: Dockerfile.flink
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRANSACTION_TOPIC: fingraph.transactions.v1
      KAFKA_DEAD_LETTER_TOPIC: fingraph.transactions.dlq.v1
      KAFKA_CONSUMER_GROUP: fingraph-neo4j-v1
      FLINK_KAFKA_CONNECTOR_JAR: /opt/flink-connectors/flink-sql-connector-kafka-3.3.0-1.20.jar
      FLINK_PYTHON_EXECUTION_MODE: process
      FLINK_PARALLELISM: 1
      FLINK_PYTHON_BUNDLE_SIZE: 50
      FLINK_PYTHON_BUNDLE_TIME_MS: 50
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: change-me-now
    restart: unless-stopped

  dashboard-api:
    profiles: ["dashboard"]
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${DASHBOARD_API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: change-me-now
      DASHBOARD_ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  neo4j_data:
